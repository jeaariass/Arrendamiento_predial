<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesion &mdash; arriendaya</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<div class="panel-formulario">
    <h1>Iniciar sesion</h1>

    <div class="error-mensaje" th:if="${error}" th:text="${error}"></div>

    <form action="/login" method="post">
        <input type="hidden" name="redirect" th:value="${redirect}">
        <div class="campo-form">
            <label>Correo electronico</label>
            <input type="email" name="email" required>
        </div>
        <div class="campo-form">
            <label>Contrasena</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit">Entrar</button>
    </form>

    <p style="font-size: 13px; color: var(--gris-suave); margin-top: 16px;">
        Cuenta de ejemplo: dueno01@arriendaya.demo / dueno011234
    </p>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
