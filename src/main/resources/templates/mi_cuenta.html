<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi cuenta &mdash; arriendaya</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<section class="seccion">
    <div class="contenedor" style="max-width: 720px;">
        <h2 style="margin-top: 0;">Mi cuenta</h2>

        <div class="exito-mensaje" th:if="${mensaje}" th:text="${mensaje}"></div>

        <div class="panel-formulario" style="margin: 0 0 24px;">
            <h1 style="font-size: 18px;">Lo que debes ahora</h1>
            <p style="font-size: 28px; font-weight: 800; margin: 4px 0 0;"
               th:text="'$' + ${#numbers.formatInteger(deuda, 0, 'POINT')} + ' COP'"></p>
            <p class="ayuda" style="margin-top: 4px;">Suma de reservas pendientes o confirmadas. Si cancelas una, se descuenta de aqui.</p>
        </div>

        <div class="panel-formulario" style="margin: 0 0 24px;">
            <h1 style="font-size: 18px;">Informacion bancaria</h1>
            <form th:action="@{/mi-cuenta/banco}" method="post">
                <div class="campo-form">
                    <label>Cuenta bancaria</label>
                    <input type="text" name="cuentaBancaria" maxlength="40"
                           th:value="${cliente.cuentaBancaria}" placeholder="Banco y numero de cuenta">
                </div>
                <button type="submit">Guardar</button>
            </form>
        </div>

        <h1 style="font-size: 18px;">Mis reservas</h1>
        <table class="tabla-admin" th:if="${not #lists.isEmpty(reservas)}">
            <thead>
                <tr>
                    <th>Alojamiento</th>
                    <th>Fechas</th>
                    <th>Valor</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reservas}">
                    <td>
                        <a th:href="@{/inmuebles/{id}(id=${r.inmueble.id})}" th:text="${r.inmueble.titulo}"></a>
                    </td>
                    <td th:text="${r.fechaInicio} + ' a ' + ${r.fechaFin}"></td>
                    <td th:text="'$' + ${#numbers.formatInteger(r.valorTotal, 0, 'POINT')}"></td>
                    <td th:text="${r.estado}"></td>
                    <td>
                        <form th:if="${r.estado.name() == 'PENDIENTE' or r.estado.name() == 'CONFIRMADA'}"
                              th:action="@{/mi-cuenta/reservas/{id}/cancelar(id=${r.id})}" method="post">
                            <button type="submit">Cancelar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="vacio" th:if="${#lists.isEmpty(reservas)}">
            Aun no tienes reservas.
        </div>
    </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
