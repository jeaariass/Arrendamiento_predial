<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${propietario.usuario.nombre} + ' ' + ${propietario.usuario.apellido} + ' &mdash; arriendaya'"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<section class="seccion">
    <div class="contenedor">

        <div class="perfil-propietario">
            <div class="avatar" th:text="${#strings.substring(propietario.usuario.nombre, 0, 1)}"></div>
            <div>
                <h1 th:text="${propietario.usuario.nombre} + ' ' + ${propietario.usuario.apellido}"></h1>
                <div class="meta" th:text="'Propietario en arriendaya'"></div>
            </div>
        </div>

        <h2 th:text="${#lists.size(inmuebles)} + ' alojamientos publicados'"></h2>

        <table class="tabla-admin" th:if="${not #lists.isEmpty(inmuebles)}">
            <thead>
                <tr>
                    <th>Alojamiento</th>
                    <th>Ciudad</th>
                    <th>Precio / noche</th>
                    <th>Estado</th>
                    <th>Reservado por</th>
                    <th>Fechas</th>
                    <th>Valor de la reserva</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="fila : ${inmuebles}">
                    <td>
                        <a th:href="@{/inmuebles/{id}(id=${fila.inmueble.id})}" th:text="${fila.inmueble.titulo}"></a>
                    </td>
                    <td th:text="${fila.inmueble.ubicacion.ciudad}"></td>
                    <td th:text="'$' + ${#numbers.formatInteger(fila.inmueble.precioNoche, 0, 'POINT')}"></td>
                    <td>
                        <span th:if="${fila.reservaActual != null}" class="badge-ocupado">Reservado</span>
                        <span th:if="${fila.reservaActual == null}" class="badge-libre">Libre</span>
                    </td>
                    <td th:text="${fila.reservaActual != null} ? (${fila.reservaActual.cliente.usuario.nombre} + ' ' + ${fila.reservaActual.cliente.usuario.apellido}) : '&mdash;'"></td>
                    <td th:text="${fila.reservaActual != null} ? (${fila.reservaActual.fechaInicio} + ' a ' + ${fila.reservaActual.fechaFin}) : '&mdash;'"></td>
                    <td th:text="${fila.reservaActual != null} ? ('$' + ${#numbers.formatInteger(fila.reservaActual.valorTotal, 0, 'POINT')}) : '&mdash;'"></td>
                </tr>
            </tbody>
        </table>

        <div class="vacio" th:if="${#lists.isEmpty(inmuebles)}">
            Este propietario aun no tiene alojamientos publicados.
        </div>
    </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
