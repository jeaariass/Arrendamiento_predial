<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultados de busqueda &mdash; arriendaya</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<section class="hero" style="padding: 26px 0;">
    <div class="contenedor">
        <form class="buscador" action="/buscar" method="get">
            <div class="campo campo-destino">
                <label>Destino</label>
                <input type="text" id="campoCiudad" name="ciudad" th:value="${ciudad}" placeholder="Ej: Cartagena" autocomplete="off">
                <div class="sugerencias" id="sugerenciasCiudad"></div>
            </div>
            <div class="campo">
                <label>Llegada</label>
                <input type="date" name="llegada" th:value="${llegada}">
            </div>
            <div class="campo">
                <label>Salida</label>
                <input type="date" name="salida" th:value="${salida}">
            </div>
            <div class="campo">
                <label>Huespedes</label>
                <input type="number" name="huespedes" min="1" th:value="${huespedes}">
            </div>
            <button type="submit">Buscar</button>
        </form>
    </div>
</section>

<section class="seccion" style="padding-bottom: 0;">
    <div class="contenedor">
        <form method="get" action="/buscar" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom: 10px;">
            <input type="hidden" name="ciudad" th:value="${ciudad}">
            <input type="hidden" name="llegada" th:value="${llegada}">
            <input type="hidden" name="salida" th:value="${salida}">
            <input type="hidden" name="huespedes" th:value="${huespedes}">
            <label style="font-size: 13px; font-weight: 700;">Tipo:</label>
            <select name="tipo" onchange="this.form.submit()">
                <option value="" th:selected="${tipo == null}">Todos</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}" th:selected="${t == tipo}"></option>
            </select>
            <label style="font-size: 13px; font-weight: 700;">Ordenar por:</label>
            <select name="orden" onchange="this.form.submit()">
                <option value="" th:selected="${orden == null or orden == ''}">Mas recientes</option>
                <option value="precio_asc" th:selected="${orden == 'precio_asc'}">Precio: menor a mayor</option>
                <option value="precio_desc" th:selected="${orden == 'precio_desc'}">Precio: mayor a menor</option>
            </select>
        </form>
    </div>
</section>

<section class="seccion">
    <div class="contenedor">
        <h2 th:text="${#lists.size(resultados)} + ' alojamientos encontrados'"
            th:if="${not #lists.isEmpty(resultados)}"></h2>

        <div class="grid-propiedades" th:if="${not #lists.isEmpty(resultados)}">
            <a class="tarjeta" th:each="i : ${resultados}" th:href="@{/inmuebles/{id}(id=${i.id})}">
                <img th:src="${i.imagenUrl}" th:alt="${i.titulo}">
                <div class="cuerpo">
                    <span class="tipo" th:text="${i.tipo}"></span>
                    <h3 th:text="${i.titulo}"></h3>
                    <div class="ubicacion" th:text="${i.ubicacion.ciudad + ', ' + i.ubicacion.pais}"></div>
                    <div class="precio">
                        <span th:text="'$' + ${#numbers.formatInteger(i.precioNoche, 0, 'POINT')}"></span>
                        <small>COP / noche</small>
                    </div>
                </div>
            </a>
        </div>

        <div class="vacio" th:if="${#lists.isEmpty(resultados)}">
            No encontramos alojamientos disponibles con esos filtros. Intenta con otras fechas o ciudad.
        </div>
    </div>
</section>

<section class="seccion">
    <div class="contenedor">
        <h2>Resultados en el mapa</h2>
        <p class="ayuda">Acerca o aleja el mapa para explorar los resultados de esta busqueda por zona</p>
        <div class="mapa-layout">
            <div id="mapa" class="mapa-contenedor"></div>
            <div id="listaMapa" class="lista-mapa"></div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>

<script th:inline="javascript">
    var CIUDADES_TOP = /*[[${ciudadesTop}]]*/ [];
    var MAPA_FILTROS = {
        ciudad: /*[[${ciudad}]]*/ null,
        llegada: /*[[${llegada}]]*/ null,
        salida: /*[[${salida}]]*/ null
    };
</script>
<script th:src="@{/js/buscador.js}"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script th:src="@{/js/mapa.js}"></script>

</body>
</html>
