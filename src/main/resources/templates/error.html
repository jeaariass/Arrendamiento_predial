<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ocurrio un error &mdash; arriendaya</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<section class="seccion">
    <div class="contenedor" style="max-width: 600px;">
        <div class="error-mensaje">
            <h2 style="margin-top: 0;">Ocurrio un error</h2>
            <p th:text="${status} + ' - ' + ${error}">Error</p>
        </div>
        <p style="margin-top: 20px;"><a href="/">&larr; Volver al inicio</a></p>
    </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
