<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${inmueble.titulo} + ' &mdash; arriendaya'"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css"
          integrity="sha384-RkASv+6KfBMW9eknReJIJ6b3UnjKOKC5bOUaNgIY778NFbQ8MtWq9Lr/khUgqtTt" crossorigin="anonymous">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<section class="seccion">
    <div class="contenedor">

        <div class="error-mensaje" th:if="${error}" th:text="${error}"></div>

        <div class="detalle-layout">
            <div>
                <img class="detalle-imagen"
                     th:src="${#strings.isEmpty(inmueble.imagenUrl)} ? @{/img/sin-imagen.svg} : ${inmueble.imagenUrl}"
                     th:alt="${inmueble.titulo}">
                <h1 th:text="${inmueble.titulo}" style="margin: 18px 0 4px;"></h1>
                <div style="color: var(--gris-suave); margin-bottom: 14px;"
                     th:text="${inmueble.ubicacion.ciudad + ', ' + inmueble.ubicacion.pais + ' - ' + inmueble.direccion}"></div>
                <p th:text="${inmueble.descripcion}"></p>
                <ul style="color: var(--gris-suave); font-size: 14px;">
                    <li th:text="'Tipo: ' + ${inmueble.tipo}"></li>
                    <li th:text="'Capacidad: ' + ${inmueble.capacidad} + ' huespedes'"></li>
                    <li>Anfitrion:
                        <a th:href="@{/propietarios/{id}(id=${inmueble.propietario.id})}"
                           th:text="${inmueble.propietario.usuario.nombre} + ' ' + ${inmueble.propietario.usuario.apellido}"></a>
                    </li>
                </ul>

                <div th:if="${inmueble.latitud != null and inmueble.longitud != null}" style="margin-top: 24px;">
                    <h2>Ubicacion y otras opciones en esta ciudad</h2>
                    <p class="ayuda">Acerca o aleja el mapa para ver otros alojamientos disponibles por la zona</p>
                    <div class="mapa-layout">
                        <div id="mapaInmueble" class="mapa-contenedor" style="height: 340px;"></div>
                        <div id="listaInmueble" class="lista-mapa" style="height: 340px;"></div>
                    </div>
                </div>
            </div>

            <div class="ficha-reserva">
                <div class="precio-grande">
                    <span th:text="'$' + ${#numbers.formatInteger(inmueble.precioNoche, 0, 'POINT')}"></span>
                    <small style="font-size: 13px; font-weight: 400;"> COP / noche</small>
                </div>

                <form th:action="@{/inmuebles/{id}/reservar/preview(id=${inmueble.id})}" method="get">
                    <div>
                        <label>Llegada</label>
                        <input type="text" id="campoLlegada" name="llegada" placeholder="Elige una fecha" autocomplete="off" required>
                    </div>
                    <div>
                        <label>Salida</label>
                        <input type="text" id="campoSalida" name="salida" placeholder="Elige una fecha" autocomplete="off" required>
                    </div>
                    <p class="ayuda" style="font-size: 12px;">Las fechas ya reservadas y pagadas no se pueden elegir.</p>
                    <button class="boton-reservar" type="submit">Ver precio y reservar</button>
                </form>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script th:src="@{/js/mapa-cercanos.js}"></script>
<script th:if="${inmueble.latitud != null and inmueble.longitud != null}" th:inline="javascript">
    var precioTexto = /*[[${'$' + #numbers.formatInteger(inmueble.precioNoche, 0, 'POINT') + ' COP / noche'}]]*/ '';
    var popupCentro = '<strong>' + /*[[${inmueble.tipo}]]*/ '' + '</strong><br>'
        + /*[[${inmueble.ubicacion.ciudad}]]*/ '' + '<br>'
        + /*[[${inmueble.capacidad}]]*/ 0 + ' huespedes<br>' + precioTexto;
    iniciarMapaCercano('mapaInmueble', 'listaInmueble',
        /*[[${inmueble.latitud}]]*/ 0, /*[[${inmueble.longitud}]]*/ 0,
        /*[[${inmueble.id}]]*/ 0, popupCentro);
</script>

<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"
        integrity="sha384-5JqMv4L/Xa0hfvtF06qboNdhvuYXUku9ZrhZh3bSk8VXF0A/RuSLHpLsSV9Zqhl6" crossorigin="anonymous"></script>
<script th:inline="javascript">
    var inmuebleId = /*[[${inmueble.id}]]*/ 0;

    fetch('/inmuebles/' + inmuebleId + '/fechas-ocupadas')
        .then(function (r) { return r.json(); })
        .then(function (rangos) {
            var ocupadas = rangos.map(function (r) { return { from: r.inicio, to: r.fin }; });

            var fpSalida = flatpickr('#campoSalida', {
                dateFormat: 'Y-m-d',
                minDate: new Date().fp_incr(1),
                disable: ocupadas
            });

            flatpickr('#campoLlegada', {
                dateFormat: 'Y-m-d',
                minDate: 'today',
                disable: ocupadas,
                onChange: function (selectedDates, dateStr) {
                    fpSalida.set('minDate', dateStr ? new Date(selectedDates[0]).fp_incr(1) : new Date().fp_incr(1));
                }
            });
        })
        .catch(function () {});
</script>

</body>
</html>
