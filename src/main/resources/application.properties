spring.application.name=arriendo-inmuebles

# --- Conexion a PostgreSQL ---
# Crea antes la base de datos: createdb arriendo_inmuebles  (o con pgAdmin)
spring.datasource.url=jdbc:postgresql://localhost:5432/arriendo_inmuebles
spring.datasource.username=postgres
spring.datasource.password=postgres

# update: crea/ajusta las tablas automaticamente a partir de las entidades.
# Cuando el modelo ya este estable, cambia esto a "validate" y maneja el esquema con migraciones.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

server.port=8080
