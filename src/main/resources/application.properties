spring.application.name=arriendo-inmuebles

# --- Conexion a PostgreSQL ---
# Crea antes la base de datos: createdb arriendo_inmuebles  (o con pgAdmin)
spring.datasource.url=jdbc:postgresql://localhost:5432/arriendo_inmuebles
spring.datasource.username=postgres
spring.datasource.password=9724

# El esquema ya no lo crea Hibernate: lo controla Flyway (src/main/resources/db/migration).
# validate solo verifica que las entidades coincidan con lo que dejaron las migraciones.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# --- Flyway ---
# baseline-on-migrate: si alguien ya tiene una BD con tablas creadas por el viejo
# ddl-auto=update (sin historial de Flyway), la marca como ya puesta al dia en V1
# y solo aplica migraciones posteriores. En una BD nueva corre todo desde V1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=esquema_inicial

server.port=58712
