# Uso LOCAL para probar la imagen Docker antes de subirla al VPS (no es el stack de produccion,
# ese vive en deploy/stacks/arriendaya y usa el PostgreSQL compartido del servidor).
#
#   docker compose up --build
#   http://localhost:8080

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: arriendo_inmuebles
      DB_USER: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: "8080"
      ADMIN_EMAIL: admin@local.test
      ADMIN_PASSWORD: admin1234local
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arriendo_inmuebles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - arriendaya_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arriendaya_local_pgdata:
