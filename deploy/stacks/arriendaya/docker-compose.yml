# Stack de produccion para /srv/stacks/arriendaya/docker-compose.yml, gestionado con Portainer.
# Sigue la plantilla del VPS (/srv/stacks/_plantilla), pero con un solo servicio porque
# arriendaya es un monolito Spring Boot + Thymeleaf (no hay frontend/backend separados).
name: arriendaya

services:
  app:
    image: ghcr.io/jeaariass/arriendaya-web:${TAG}
    container_name: arriendaya-app
    # Informacion que muestra el panel. Aparece sola al desplegar.
    labels:
      panel.tipo: "proyecto"
      panel.nombre: "arriendaya"
      panel.descripcion: "Arriendo de inmuebles por dias (proyecto academico)"
      panel.url: "https://arriendaya.179-197-81-33.sslip.io"
      panel.repo: "https://github.com/jeaariass/Arrendamiento_predial"
      panel.base: "arriendaya"
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: db-postgis
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: "8080"
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${PUERTO}:8080"
    networks: [default, db_net]

networks:
  default:
    name: arriendaya_net
  db_net:
    external: true
